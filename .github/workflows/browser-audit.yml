name: Browser frontend audit
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Check live desktop and mobile checkout
        run: node tests/browser-audit.mjs
